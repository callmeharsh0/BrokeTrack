name: Notitrack
description: "AI Expense Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.8.3

  tflite_flutter: ^0.11.0

  crypto: ^3.0.1
  path_provider: ^2.0.14
  intl: ^0.20.1

  cupertino_icons: ^1.0.8
  
  # UI Enhancements
  flutter_slidable: ^3.0.1
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  share_plus: ^7.2.1
  pdf: ^3.10.7
  csv: ^6.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0



flutter:
  uses-material-design: true

  assets:
    - assets/sms_ner_csv_labels.tflite
    - assets/word_tokenizer_csv.json
    - assets/tag_tokenizer_csv.json

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600

